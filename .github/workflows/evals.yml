name: Evals

# Runs the fx-assistant evals against the real Claude API. Costs money (cents per run), so it runs on demand and
# once a week, not on every push. Needs the repository secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set (Settings → Secrets and variables → Actions); evals skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the API accepts the key (free request)
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RAW="$ANTHROPIC_API_KEY"
          KEY="$(printf '%s' "$RAW" | tr -d '[:space:]"'"'"'')"   # spaces, newlines and quotes
          KEY="${KEY#ANTHROPIC_API_KEY=}"                          # a pasted NAME=value line
          # Safe diagnostics: never the key, only its shape.
          echo "Secret length: ${#RAW} characters (after cleaning: ${#KEY})."
          [ "$KEY" != "$RAW" ] && echo "::warning::Spaces, quotes or an ANTHROPIC_API_KEY= prefix were removed from the secret."
          case "$KEY" in
            sk-ant-*) echo "Prefix: sk-ant- (an Anthropic API key)." ;;
            *sk-ant-*) echo "::error::The secret contains sk-ant- but not at the start: something was pasted before the key."; exit 1 ;;
            sk-*) echo "::error::The secret starts with sk- but not sk-ant-: probably a key of another provider."; exit 1 ;;
            *) echo "::error::The secret does not look like an Anthropic API key (it should start with sk-ant-). Length ${#KEY}; an Anthropic key is about 100 characters."; exit 1 ;;
          esac
          echo "::add-mask::$KEY"
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"   # the cleaned key for the next steps
          CODE=$(curl -s -o /tmp/models.json -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01")
          case "$CODE" in
            200) echo "The API accepts the key." ;;
            401) echo "::error::The API rejected the key (401). Create a new key in Claude Console → API Keys and save it again as the ANTHROPIC_API_KEY secret."; exit 1 ;;
            403) echo "::error::The key has no permission (403). Check that the key's workspace is active."; exit 1 ;;
            *) echo "::error::Unexpected answer $CODE from the API:"; head -c 300 /tmp/models.json; exit 1 ;;
          esac

      - name: Run the evals
        id: evals
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: npx playwright test --project=evals

      - name: Summary, latency and cost budget
        if: steps.key.outputs.present == 'true'
        run: node scripts/eval-summary.mjs

      - name: Upload eval results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: |
            eval-results
            playwright-report
          retention-days: 30

      - name: Fail the job if an eval failed
        if: steps.evals.outcome == 'failure'
        run: exit 1
